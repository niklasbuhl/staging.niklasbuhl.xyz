			these the site-wide defaults rather than decoration. PageHead.svelte overrides
			the title and the og pair per route once the app mounts, which is what a
			visitor sees in the tab; a crawler that does not run scripts keeps what is
			below. Per-route social cards need the head prerendered, which needs ssr.
